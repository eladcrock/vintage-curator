# Static SPA deploy for this TanStack Start project.
# The app has no server functions or API routes, so we ship the client bundle
# only. SPA deep-link routing is handled by public/_redirects.

[build]
  command = "npm run build"
  publish = "dist/client"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"